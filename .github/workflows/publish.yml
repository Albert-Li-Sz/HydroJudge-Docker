name: Publish amd64 image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: hydrojudge-image-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image metadata
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "REVISION_TAG=sha-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Check sources
        shell: bash
        run: |
          bash -n runtime/entrypoint.sh scripts/*.sh tests/integration/hydro/entrypoint.sh
          shellcheck runtime/entrypoint.sh scripts/*.sh tests/integration/hydro/entrypoint.sh
          for source in runtime/*.cjs patches/*.cjs tests/integration/*.cjs; do node --check "$source"; done
          python3 -B - <<'PY'
          from pathlib import Path
          for source in Path('tests/integration').glob('*.py'):
              compile(source.read_text(), str(source), 'exec')
          PY
          docker compose config --quiet
          docker compose -f tests/integration/compose.yml config --quiet
          git diff --check

      - name: Build amd64 image
        shell: bash
        run: |
          docker buildx build --platform linux/amd64 --load \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag hydrojudge:validation \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$REVISION_TAG" .

      - name: Validate on native amd64 Linux
        run: |
          bash scripts/validate-image.sh
          test -z "$(git status --porcelain)"

      - name: Publish tested image to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$REVISION_TAG"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' > .local-test/published-manifest.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('.local-test/published-manifest.json').read_text())
          result = dict(image=os.environ['IMAGE'], version=os.environ['VERSION'],
                        revision=os.environ['GITHUB_SHA'], digest=manifest['digest'], platform='linux/amd64')
          Path('.local-test/publication.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
          {
            echo "Published: \`$IMAGE:$VERSION\`"
            echo
            echo "Revision: \`$GITHUB_SHA\`"
            echo
            echo '```json'
            cat .local-test/publication.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation and publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amd64-validation-${{ github.sha }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .local-test/qa/results.json
            .local-test/qa/results-default-limits.json
            .local-test/qa/results-upgrade-*.json
            .local-test/qa/cache-upgrade-*.json
            .local-test/qa/concurrency.json
            .local-test/qa/language-filter.json
            .local-test/qa/pretest.json
            .local-test/qa/environment.json
            .local-test/qa/site-languages.json
            .local-test/qa/diagnostics.log
            .local-test/qa/client-*.log
            .local-test/qa/sandbox-*.log
            .local-test/publication.json
            .local-test/published-manifest.json

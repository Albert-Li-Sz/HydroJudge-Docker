services:
  judge:
    image: ${JUDGE_IMAGE:-hydrojudge:4.0.6-local}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    privileged: true
    restart: unless-stopped
    shm_size: ${JUDGE_SHM_SIZE:-1gb}
    stop_grace_period: 30s
    ulimits:
      stack:
        soft: -1
        hard: -1
    environment:
      CONFIG_FILE: /config/judge.yaml
    volumes:
      - type: bind
        source: ./config
        target: /config
        read_only: true
      - type: volume
        source: judge-cache
        target: /var/cache/hydrojudge
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

volumes:
  judge-cache:
